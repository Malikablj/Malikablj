; NPD Project Control — pengaturan PHP per folder (PHP-FPM / CGI / LiteSpeed). Di cPanel dapat juga diatur
; lewat MultiPHP INI Editor; upload_max_filesize harus >= Pengaturan › Batas unggah (bawaan 25 MB).
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
display_errors = Off
log_errors = On
date.timezone = Asia/Jakarta
session.use_strict_mode = 1
