<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="NPD Project Control — kontrol project New Mold & Subcont: workflow, approval, dokumen, timeline, dan AI Assistant." />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Ctext x='32' y='40' font-family='Arial' font-weight='700' font-size='20' fill='white' text-anchor='middle'%3ENPD%3C/text%3E%3C/svg%3E" />
    <title>NPD Project Control</title>
    <script>
      try {
        var t = localStorage.getItem('npd-pref:theme');
        t = t ? JSON.parse(t) : 'light';
        if (t === 'system') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
