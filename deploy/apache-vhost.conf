# NPD Project Control — Apache 2.4 + PHP-FPM (contoh). Modul: ssl, proxy_fcgi, headers, deflate, expires.
#   a2enmod ssl proxy_fcgi headers deflate expires && a2ensite npd
# Document root HANYA folder public/; AllowOverride None (tidak bergantung .htaccess).

<VirtualHost *:80>
    ServerName npd.example.co.id
    Redirect permanent / https://npd.example.co.id/
</VirtualHost>

<VirtualHost *:443>
    ServerName npd.example.co.id
    DocumentRoot /var/www/npd/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/npd/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/npd/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/npd/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # file tersembunyi (.env, .git) selalu ditolak
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>
    ProxyTimeout 120

    # upload dokumen maks. 25 MB + overhead form (byte)
    LimitRequestBody 31457280

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    <Location /assets/>
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
        Header set Cache-Control "public"
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/npd-error.log
    CustomLog ${APACHE_LOG_DIR}/npd-access.log combined
</VirtualHost>
