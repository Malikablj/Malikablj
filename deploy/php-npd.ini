; NPD Project Control — pengaturan PHP produksi (contoh). Salin ke conf.d PHP-FPM & CLI, mis.
;   /etc/php/8.3/fpm/conf.d/90-npd.ini  dan  /etc/php/8.3/cli/conf.d/90-npd.ini
; Ekstensi wajib: pdo_mysql, mbstring, json, fileinfo, sodium, gd, zip, xml, dom, iconv, zlib, openssl.

date.timezone = Asia/Jakarta
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; upload dokumen (setting aplikasi upload.max_mb bawaan 25 MB — naikkan keduanya bersamaan)
file_uploads = On
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20

; export PDF/Excel (mPDF, PhpSpreadsheet)
memory_limit = 256M
max_execution_time = 120

session.use_strict_mode = 1
session.cookie_httponly = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; 1 = membaca perubahan file otomatis. Bila 0, reload PHP-FPM setiap kali deploy.
opcache.validate_timestamps = 1
realpath_cache_size = 4096K
