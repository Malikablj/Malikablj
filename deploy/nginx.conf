# NPD Project Control — Nginx + PHP-FPM (contoh). Ganti server_name, path, sertifikat, dan versi PHP-FPM.
# Document root HANYA folder public/; config, storage, modules, .env tidak pernah dapat diakses dari web.

server {
    listen 80;
    server_name npd.example.co.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name npd.example.co.id;

    root /var/www/npd/public;
    index index.php;

    ssl_certificate     /etc/ssl/npd/fullchain.pem;
    ssl_certificate_key /etc/ssl/npd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # upload dokumen maks. 25 MB (setting upload.max_mb) + overhead form
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/npd-access.log;
    error_log  /var/log/nginx/npd-error.log;

    # file tersembunyi (.env, .git, .htaccess) selalu ditolak
    location ~ /\. { deny all; }

    # aset statis berversi (?v=) — boleh di-cache lama
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 120s;   # export PDF/Excel besar
    }
}
