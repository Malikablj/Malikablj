# Local PostgreSQL for development. Usage: docker compose up -d
# Reads POSTGRES_PASSWORD from .env; bound to localhost only.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pik_marketing
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pik -d pik_marketing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pik_pgdata:
