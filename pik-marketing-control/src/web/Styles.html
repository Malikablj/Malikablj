<style>
  /*
   * PIK Marketing Control — design system.
   * Tokens from the Technical Specification §12; a controlled accent for interactive elements; 4/8 px spacing rhythm.
   * Status colours are used as dots/bars; text on tinted backgrounds uses the darker "ink" shades for contrast.
   */
  :root {
    --color-bg: #F5F5F7;
    --color-surface: #FFFFFF;
    --color-surface-2: #FAFAFC;
    --color-text: #111111;
    --color-muted: #6E6E73;
    --color-subtle: #8E8E93;
    --color-border: #D2D2D7;
    --color-hairline: #E6E6EB;
    --color-success: #34C759;
    --color-warning: #FF9F0A;
    --color-danger: #FF3B30;
    --color-accent: #0A5BC4;
    --color-accent-hover: #084DA6;
    --color-accent-soft: #EAF1FC;
    --ink-success: #1B7A34;
    --ink-warning: #955400;
    --ink-danger: #C1271D;
    --ink-accent: #0A4FA8;
    --tint-success: #E9F8EE;
    --tint-warning: #FFF3DF;
    --tint-danger: #FFEEED;
    --tint-neutral: #F0F0F3;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow-soft: 0 4px 18px rgba(0, 0, 0, .06);
    --shadow-pop: 0 18px 48px rgba(0, 0, 0, .14);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --sidebar-w: 248px;
    --topbar-h: 60px;
    --bottomnav-h: 64px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --focus: 0 0 0 3px rgba(10, 91, 196, .28);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font: 14px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); letter-spacing: -.01em; }
  h1 { font-size: 28px; line-height: 1.2; font-weight: 650; }
  h2 { font-size: 19px; line-height: 1.3; font-weight: 620; }
  h3 { font-size: 15px; line-height: 1.35; font-weight: 600; }
  p { margin: 0; }
  a { color: var(--ink-accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--color-muted); }
  .subtle { color: var(--color-subtle); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .nowrap { white-space: nowrap; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .stack-sm { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-sm { width: 16px; height: 16px; }
  .icon-lg { width: 28px; height: 28px; }

  /* ---------------------------------------------------------------- Boot / login */
  .boot { min-height: 100vh; display: grid; place-items: center; color: var(--color-muted); }
  .boot-mark { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none;
    background: linear-gradient(145deg, #1C1C1E, #3A3A3C); color: #fff; font: 700 14px/1 var(--font-display); letter-spacing: .02em;
  }
  .login {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #FFFFFF 0%, var(--color-bg) 60%);
  }
  .login-card {
    width: 100%; max-width: 420px; background: var(--color-surface); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft); padding: 40px 36px 32px; display: flex; flex-direction: column; gap: 24px;
  }
  .login-card h1 { font-size: 26px; }
  .login-identity {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--color-bg);
  }
  .login-foot { font-size: 12px; color: var(--color-subtle); text-align: center; }

  /* ---------------------------------------------------------------- App shell */
  .shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--color-surface-2);
    border-right: 1px solid var(--color-hairline); display: flex; flex-direction: column; padding: 16px 12px;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
  .sidebar-brand strong { font: 650 15px/1.2 var(--font-display); }
  .sidebar-brand span { display: block; font-size: 12px; color: var(--color-muted); }
  .nav-group { margin-bottom: 14px; }
  .nav-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-subtle); padding: 6px 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; cursor: pointer; text-align: left;
    padding: 8px 10px; border-radius: var(--radius-sm); color: #2C2C2E; font-weight: 500; transition: background .15s var(--ease);
  }
  .nav-item:hover { background: #EDEDF0; text-decoration: none; }
  .nav-item.active { background: var(--color-accent-soft); color: var(--ink-accent); }
  .nav-item .icon { color: var(--color-muted); }
  .nav-item.active .icon { color: var(--color-accent); }
  .nav-count { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; font-size: 11px; font-weight: 600; display: grid; place-items: center; background: var(--tint-danger); color: var(--ink-danger); }
  .sidebar-foot { margin-top: auto; padding: 12px 10px 4px; font-size: 12px; color: var(--color-subtle); }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 20; height: var(--topbar-h); display: flex; align-items: center; gap: 12px; padding: 0 32px;
    background: rgba(245, 245, 247, .94); border-bottom: 1px solid rgba(0, 0, 0, .06);
  }
  .topbar-title { font: 600 15px/1.2 var(--font-display); display: none; }
  .search-trigger {
    display: flex; align-items: center; gap: 8px; height: 36px; min-width: 280px; padding: 0 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--color-hairline); background: var(--color-surface); color: var(--color-subtle); text-align: left;
  }
  .search-trigger:hover { border-color: var(--color-border); }
  .search-trigger kbd { margin-left: auto; font: 11px/1 var(--font); border: 1px solid var(--color-hairline); border-radius: 5px; padding: 3px 5px; color: var(--color-subtle); }
  .icon-button {
    position: relative; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px; cursor: pointer;
    background: transparent; color: #3A3A3C;
  }
  .icon-button:hover { background: rgba(0, 0, 0, .05); }
  .icon-button .dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--color-danger); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #E5E5EA; color: #3A3A3C;
    font: 600 12px/1 var(--font); letter-spacing: .02em;
  }
  .avatar-lg { width: 44px; height: 44px; font-size: 15px; }
  .user-button { display: flex; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; padding: 4px 6px; border-radius: 10px; }
  .user-button:hover { background: rgba(0, 0, 0, .05); }
  .user-button .name { font-weight: 550; font-size: 13px; }
  .user-button .role { font-size: 11px; color: var(--color-muted); }

  .content { width: 100%; max-width: 1320px; margin: 0 auto; padding: 28px 32px 48px; }
  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-head .titles { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .page-sub { color: var(--color-muted); }
  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-muted); }
  .breadcrumb button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-accent); font-size: 13px; }

  .bottom-nav { display: none; }

  /* ---------------------------------------------------------------- Surfaces */
  .card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); }
  .card-pad { padding: 20px 24px; }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px 0; }
  .card-head h2 { font-size: 16px; }
  .card-head .link { margin-left: auto; font-size: 13px; }
  .card-body { padding: 16px 24px 20px; }
  .section-title { font: 600 13px/1.2 var(--font); color: var(--color-muted); text-transform: uppercase; letter-spacing: .05em; margin: 8px 0 12px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border: 0; text-align: left; font: inherit; }
  button.kpi { cursor: pointer; transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
  button.kpi:hover { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(0, 0, 0, .08); }
  .kpi-label { font-size: 13px; color: var(--color-muted); display: flex; align-items: center; gap: 6px; }
  .kpi-value { font: 650 30px/1.1 var(--font-display); letter-spacing: -.02em; }
  .kpi-foot { font-size: 12px; color: var(--color-subtle); }
  .kpi.warn .kpi-value { color: var(--ink-warning); }
  .kpi.danger .kpi-value { color: var(--ink-danger); }

  /* ---------------------------------------------------------------- Buttons & inputs */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font-weight: 550; font-size: 13.5px;
    transition: background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease); white-space: nowrap; text-decoration: none;
  }
  .btn:hover { background: #F7F7F9; text-decoration: none; }
  .btn:focus-visible { box-shadow: var(--focus); outline: none; }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
  .btn-danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
  .btn-danger:hover { background: #E0342A; }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-accent); }
  .btn-ghost:hover { background: var(--color-accent-soft); }
  .btn-quiet { border-color: transparent; background: transparent; color: #3A3A3C; }
  .btn-quiet:hover { background: rgba(0, 0, 0, .05); }
  .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
  .btn-icon { width: 36px; padding: 0; }
  .btn-sm.btn-icon { width: 30px; }
  .btn-lg { height: 44px; padding: 0 20px; font-size: 15px; border-radius: 11px; }
  .btn-block { width: 100%; }
  .btn .spinner { width: 14px; height: 14px; border-width: 2px; }

  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field-label { font-size: 13px; font-weight: 550; color: #2C2C2E; }
  .field-label .req { color: var(--ink-danger); margin-left: 2px; }
  .field-hint { font-size: 12px; color: var(--color-muted); }
  .field-error { font-size: 12px; color: var(--ink-danger); display: flex; gap: 4px; align-items: flex-start; }
  .input, .select, .textarea {
    width: 100%; height: 40px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface);
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease); min-width: 0;
  }
  .textarea { height: auto; min-height: 88px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
  .select { appearance: none; -webkit-appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, #8E8E93 50%), linear-gradient(135deg, #8E8E93 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--color-accent); box-shadow: var(--focus); }
  .input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--color-danger); }
  .input:disabled, .select:disabled, .textarea:disabled { background: var(--color-bg); color: var(--color-muted); }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; }
  .check input { width: 18px; height: 18px; accent-color: var(--color-accent); }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 16px; }
  .form-grid .span-2 { grid-column: 1 / -1; }
  .form-section { font: 600 12px/1.2 var(--font); text-transform: uppercase; letter-spacing: .05em; color: var(--color-muted); grid-column: 1 / -1; padding-top: 8px; }
  .form-alert { padding: 12px 14px; border-radius: var(--radius-md); background: var(--tint-danger); color: var(--ink-danger); font-size: 13px; display: flex; gap: 8px; }
  .form-alert.warn { background: var(--tint-warning); color: var(--ink-warning); }
  .form-alert.info { background: var(--color-accent-soft); color: var(--ink-accent); }

  .search-box { position: relative; min-width: 220px; flex: 1; max-width: 360px; }
  .search-box .icon { position: absolute; left: 11px; top: 10px; color: var(--color-subtle); width: 18px; height: 18px; }
  .search-box .input { padding-left: 36px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar .select { width: auto; min-width: 150px; height: 36px; }
  .toolbar .input { height: 36px; }
  .toolbar-filters { display: contents; }
  .date-range { display: inline-flex; align-items: center; gap: 6px; }
  .date-range .input { width: 150px; }
  .date-range span { color: var(--color-muted); font-size: 13px; }
  .filter-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--color-surface); border: 1px solid var(--color-hairline); font-size: 13px; cursor: pointer; }
  .filter-chip[aria-pressed="true"] { background: var(--color-text); color: #fff; border-color: var(--color-text); }

  .segmented { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: #E8E8ED; max-width: 100%; overflow-x: auto; }
  .segmented button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 550; font-size: 13px; color: #3A3A3C; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .segmented button[aria-selected="true"] { background: var(--color-surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); color: var(--color-text); }
  .segmented .count { font-size: 11px; color: var(--color-muted); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-hairline); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; font-weight: 550; color: var(--color-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .tabs button[aria-selected="true"] { color: var(--color-text); border-bottom-color: var(--color-text); }
  .tabs .count { font-size: 11px; background: var(--tint-neutral); border-radius: 9px; padding: 1px 7px; color: var(--color-muted); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------- Badges, progress */
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 550; white-space: nowrap; background: var(--tint-neutral); color: #3A3A3C; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
  .badge.plain::before { display: none; }
  .badge.success { background: var(--tint-success); color: var(--ink-success); }
  .badge.warning { background: var(--tint-warning); color: var(--ink-warning); }
  .badge.danger { background: var(--tint-danger); color: var(--ink-danger); }
  .badge.accent { background: var(--color-accent-soft); color: var(--ink-accent); }
  .badge.muted { background: var(--tint-neutral); color: var(--color-muted); }
  .priority { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-muted); }
  .priority i { width: 8px; height: 8px; border-radius: 2px; background: #C7C7CC; display: inline-block; }
  .priority.HIGH i { background: var(--color-warning); }
  .priority.CRITICAL i { background: var(--color-danger); }
  .priority.MEDIUM i { background: #8E8E93; }
  .legacy-tag { font-size: 11px; font-weight: 600; color: #6E6E73; border: 1px solid var(--color-hairline); border-radius: 5px; padding: 1px 5px; }
  .progress { height: 6px; border-radius: 3px; background: #E8E8ED; overflow: hidden; min-width: 80px; }
  .progress > span { display: block; height: 100%; border-radius: 3px; background: var(--color-accent); transition: width .3s var(--ease); }
  .progress.complete > span { background: var(--color-success); }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-muted); margin-top: 4px; }

  /* ---------------------------------------------------------------- Tables & lists */
  .table-wrap { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--color-muted); padding: 12px 16px; border-bottom: 1px solid var(--color-hairline); background: var(--color-surface); white-space: nowrap; }
  .table th.sortable { cursor: pointer; user-select: none; }
  .table th.sortable:hover { color: var(--color-text); }
  .table th .sort { display: inline-block; margin-left: 4px; opacity: .8; }
  .table td { padding: 13px 16px; border-bottom: 1px solid var(--color-hairline); vertical-align: middle; }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr.clickable { cursor: pointer; }
  .table tbody tr.clickable:hover td { background: #FAFAFC; }
  .table tbody tr.archived td { color: var(--color-subtle); }
  .table .right { text-align: right; }
  .table .primary { font-weight: 550; color: var(--color-text); }
  .table .secondary { display: block; font-size: 12px; color: var(--color-muted); margin-top: 2px; }
  .table-compact td { padding: 10px 14px; white-space: nowrap; }
  .table-foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--color-hairline); font-size: 13px; color: var(--color-muted); }
  .pager { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .cards-list { display: none; }
  .list-card { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 0; text-align: left; width: 100%; font: inherit; cursor: pointer; }
  .list-card .top { display: flex; align-items: flex-start; gap: 8px; }
  .list-card .title { font-weight: 600; flex: 1; min-width: 0; }
  .list-card .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--color-muted); }
  .kv { display: grid; grid-template-columns: minmax(120px, 38%) 1fr; gap: 10px 16px; font-size: 13.5px; }
  .kv dt { color: var(--color-muted); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .mini-list { display: flex; flex-direction: column; }
  .mini-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-hairline); min-width: 0; }
  .mini-item:last-child { border-bottom: 0; }
  button.mini-item { border-left: 0; border-right: 0; border-top: 0; background: none; width: 100%; text-align: left; font: inherit; cursor: pointer; }
  button.mini-item:hover .mini-title { color: var(--ink-accent); }
  .mini-main { flex: 1; min-width: 0; }
  .mini-title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-sub { font-size: 12.5px; color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-side { text-align: right; font-size: 12.5px; color: var(--color-muted); flex: none; }
