<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --text: #111111;
    --muted: #6E6E73;
    --border: #D2D2D7;
    --success: #34C759;
    --warning: #FF9F0A;
    --danger: #FF3B30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }
  .page { padding: 32px; }
  .page pre { white-space: pre-wrap; color: var(--muted); }
</style>
