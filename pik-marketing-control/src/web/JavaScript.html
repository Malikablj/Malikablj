<script>
  // Server text is always inserted with textContent, never innerHTML, so it cannot inject markup.
  function renderPage(title, body) {
    var main = document.createElement('main');
    main.className = 'page';
    var heading = document.createElement('h1');
    heading.textContent = title;
    var detail = document.createElement('pre');
    detail.textContent = body;
    main.appendChild(heading);
    main.appendChild(detail);
    var app = document.getElementById('app');
    app.textContent = '';
    app.appendChild(main);
  }

  function boot() {
    google.script.run
      .withSuccessHandler(function (response) {
        if (!response || !response.success) {
          renderPage('Aplikasi belum siap', response && response.error ? response.error.message : 'Respons server tidak valid.');
          return;
        }
        renderPage(response.data.app, 'Fondasi aplikasi aktif. Skema database versi ' + response.data.schemaVersion + '.');
      })
      .withFailureHandler(function (error) {
        renderPage('Aplikasi mengalami kendala', 'Silakan muat ulang halaman atau hubungi Admin.');
        console.error(error);
      })
      .getAppHealth();
  }

  document.addEventListener('DOMContentLoaded', boot);
</script>
