{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card empty" style="padding:64px 24px">
  <p class="subtle">Error {{ code }}</p>
  <p class="title" style="font-size:20px;margin-top:6px">{{ title }}</p>
  {% if message %}<p class="desc">{{ message }}</p>{% endif %}
  <p class="mt"><a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Ke Dashboard</a></p>
</div>
{% endblock %}
